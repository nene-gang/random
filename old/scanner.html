<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner - Cascinar Mangiando</title>
<style>
  :root{
    --cream:#f5f0e6;
    --brown:#8a6d3b;
    --sage:#7d8c6a;
    --ink:#33302a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Trebuchet MS', Verdana, sans-serif;
    background:var(--cream);
    color:var(--ink);
    padding:16px;
    max-width:420px;
    margin:0 auto;
    text-align:center;
  }
  h1{ font-size:1.2rem; color:var(--brown); }
  select{
    font-size:1rem;
    padding:8px;
    border-radius:8px;
    margin-bottom:12px;
  }
  #reader{
    width:100%;
    border-radius:12px;
    overflow:hidden;
  }
  #result{
    margin-top:14px;
    font-weight:bold;
    min-height:30px;
  }
  .ok{ color:var(--sage); }
  .err{ color:#c0392b; }
</style>
</head>
<body>
  <h1>📷 Scanner check-in organizzatore</h1>

  <label for="tappa">Tappa attuale:</label><br>
  <select id="tappa">
    <option value="t1">Tappa I - Circolo San Giovanni</option>
    <option value="t2">Tappa II - Da Ema e Wendy</option>
    <option value="t3">Tappa III - Da Gaber e Lele</option>
    <option value="t4">Tappa IV - Big Bamboo</option>
  </select>

  <div id="reader"></div>
  <div id="result"></div>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  const resultDiv = document.getElementById("result");
  let lastId = "";
  let lastTime = 0;

  function onScan(decodedText){
    const now = Date.now();
    if(decodedText === lastId && now - lastTime < 4000) return; // evita doppi scan
    lastId = decodedText;
    lastTime = now;

    const tappa = document.getElementById("tappa").value;

    fetch("/api/checkin", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id: decodedText, tappa})
    })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      resultDiv.className = "ok";
      resultDiv.textContent = "✅ " + (data.nome || "Partecipante") + " validato per " + tappa.toUpperCase();
    })
    .catch(()=>{
      resultDiv.className = "err";
      resultDiv.textContent = "❌ Errore nella validazione";
    });
  }

  const scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 220 },
    onScan
  );
</script>
</body>
</html>
