<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoraggio - Cascinar Mangiando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f3ede0;
    --paper:#fdfaf3;
    --brown:#8a6d3b;
    --brown-dark:#6e5527;
    --sage:#7d8c6a;
    --lavender:#9a86b3;
    --ink:#3a3226;
    --line:#cfc7b4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Patrick Hand', cursive;
    background:var(--cream);
    color:var(--ink);
    padding:16px;
    max-width:760px;
    margin:0 auto;
  }
  a{ color:var(--brown); text-decoration:none; font-weight:bold; }
  h1{
    font-family:'Caveat', cursive;
    font-size:2rem;
    text-align:center;
    color:var(--brown-dark);
    margin:6px 0 4px;
  }
  .summary{
    text-align:center;
    font-size:1.1rem;
    color:var(--sage);
    margin-bottom:16px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--paper);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 14px rgba(60,45,20,0.1);
  }
  th, td{
    padding:10px 8px;
    text-align:center;
    border-bottom:1px solid var(--line);
    font-size:0.95rem;
  }
  th{
    background:var(--brown);
    color:#fff;
    font-family:'Caveat', cursive;
    font-size:1.2rem;
    font-weight:700;
  }
  td.nome{
    text-align:left;
    font-weight:bold;
    color:var(--brown-dark);
  }
  .ok{ color:var(--sage); font-size:1.2rem; }
  .pending{ color:#ddd; font-size:1.2rem; }
  .glasses{
    font-weight:bold;
    color:var(--lavender);
  }
  .refresh{
    display:block;
    text-align:center;
    margin:14px 0;
  }
  .loading{
    text-align:center;
    color:#999;
    margin-top:20px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    margin-bottom:6px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <a href="index.html">← Locandina</a>
    <a href="scanner.html">📷 Scanner</a>
  </div>

  <h1>📋 Monitoraggio partecipanti</h1>
  <div class="summary" id="summary"></div>

  <div id="content" class="loading">Caricamento...</div>

  <a class="refresh" href="#" onclick="load(); return false;">🔄 Aggiorna</a>

<script>
const TAPPE = ["t1","t2","t3","t4"];
const TAPPE_LABEL = ["Tappa I","Tappa II","Tappa III","Tappa IV"];

async function load(){
  const content = document.getElementById("content");
  content.className = "loading";
  content.textContent = "Caricamento...";

  try {
    const res = await fetch("/api/monitor");
    const data = await res.json();
    const participants = data.participants || [];

    document.getElementById("summary").textContent =
      `${participants.length} partecipanti · 🍷 ${participants.reduce((s,p)=>s+(p.glasses||0),0)} consumazioni totali`;

    if(participants.length === 0){
      content.className = "loading";
      content.textContent = "Nessun partecipante registrato.";
      return;
    }

    let html = `<table><thead><tr><th>Nome</th>`;
    TAPPE_LABEL.forEach(t => html += `<th>${t}</th>`);
    html += `<th>🍷</th></tr></thead><tbody>`;

    participants.forEach(p => {
      html += `<tr><td class="nome">${escapeHtml(p.nome)}</td>`;
      TAPPE.forEach(t => {
        html += `<td class="${p.checkins[t] ? 'ok':'pending'}">${p.checkins[t] ? '✅':'—'}</td>`;
      });
      html += `<td class="glasses">${p.glasses}</td></tr>`;
    });

    html += `</tbody></table>`;
    content.className = "";
    content.innerHTML = html;
  } catch(e){
    content.className = "loading";
    content.textContent = "Errore nel caricamento dei dati.";
  }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
